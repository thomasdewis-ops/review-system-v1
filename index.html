<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Com'è stata la tua esperienza?</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1d1d1f;
      opacity: 0;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 460px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* ⭐ STAR RATING — PREMIUM VERSION */
    .stars {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      font-size: 52px;
      cursor: pointer;
      user-select: none;
    }

    .star {
      color: #d2d2d7;
      transition: color 0.22s ease, transform 0.22s ease;
      padding: 4px;
    }

    .star.hovered,
    .star.active {
      color: #ffcc00;
      transform: scale(1.15);
    }

    /* ⭐ FEEDBACK BOX */
    #feedbackBox {
      display: none;
      margin-bottom: 24px;
      animation: fadeLift 0.35s ease-out;
    }

    @keyframes fadeLift {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 18px 20px;
      font-size: 18px;
      line-height: 1.55;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 18px;
      background: #fafafa;
      outline: none;
      resize: none;
      color: #1d1d1f;
      transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    textarea::placeholder {
      color: rgba(0,0,0,0.35);
    }

    textarea:focus {
      background: #ffffff;
      border-color: rgba(0,122,255,0.45);
      box-shadow: 0 0 0 4px rgba(0,122,255,0.12);
    }

    /* ⭐ BUTTON */
    button {
      padding: 16px 28px;
      font-size: 18px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      max-width: 300px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Com'è stata la tua esperienza?</h2>

    <form id="ratingForm" action="https://hook.eu1.make.com/qqu1s3exnhnfe8ntxsk8dg67j41tljiv" method="post">

      <input type="hidden" name="client_id" id="client_id">
      <input type="hidden" name="rating" id="rating">

      <div class="stars">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>

      <div id="feedbackBox">
        <textarea name="feedback" placeholder="Lascia qui il tuo feedback"></textarea>
      </div>

      <button type="submit">Invia</button>
    </form>
  </div>

  <script>
    // Extract client_id from URL
    const clientId = window.location.pathname.split("/").pop();
    document.getElementById("client_id").value = clientId;

    const stars = document.querySelectorAll(".star");
    const ratingInput = document.getElementById("rating");
    const feedbackBox = document.getElementById("feedbackBox");

    let lockedRating = 0;

    // ⭐ HOVER cumulative highlight
    stars.forEach(star => {
      star.addEventListener("mouseover", () => {
        const hoverValue = parseInt(star.dataset.value);

        stars.forEach(s => {
          const v = parseInt(s.dataset.value);
          s.classList.toggle("hovered", v <= hoverValue);
        });
      });

      star.addEventListener("mouseout", () => {
        // Remove hover state
        stars.forEach(s => s.classList.remove("hovered"));

        // Restore locked rating
        stars.forEach(s => {
          const v = parseInt(s.dataset.value);
          s.classList.toggle("active", v <= lockedRating);
        });
      });

      // ⭐ CLICK locks rating
      star.addEventListener("click", () => {
        lockedRating = parseInt(star.dataset.value);
        ratingInput.value = lockedRating;

        // Apply locked highlight
        stars.forEach(s => {
          const v = parseInt(s.dataset.value);
          s.classList.toggle("active", v <= lockedRating);
        });

        // Feedback box for 1–3 stars
        feedbackBox.style.display = lockedRating <= 3 ? "block" : "none";
      });
    });

    // ⭐ Prevent submission without rating
    document.getElementById("ratingForm").addEventListener("submit", function(e) {
      if (!ratingInput.value) {
        e.preventDefault();
        alert("Seleziona una valutazione prima di inviare.");
      }
    });
  </script>
</body>
</html>
