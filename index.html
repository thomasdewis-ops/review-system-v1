<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Com'è stata la tua esperienza?</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1d1d1f;
      opacity: 0;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 460px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 28px;
      font-size: 58px;
      cursor: pointer;
    }

    .star {
      color: #d2d2d7;
      transition: color 0.18s ease-out, transform 0.18s ease-out;
      padding: 6px;
    }

    .star.active {
      color: #ffcc00;
      transform: scale(1.18);
    }

    #dynamicArea {
      opacity: 0;
      transition: opacity 0.25s ease;
      margin-bottom: 24px;
    }

    #dynamicArea.visible {
      opacity: 1;
    }

    /* Elegant iOS-style textarea */
    textarea {
      width: 100%;
      height: 150px;
      padding: 18px 20px;
      font-size: 18px;
      line-height: 1.55;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 18px;
      background: #fafafa;
      outline: none;
      resize: none;
      color: #1d1d1f;

      box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.06),
        0 1px 2px rgba(0,0,0,0.04);

      transition:
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
    }

    textarea::placeholder {
      color: rgba(0,0,0,0.35);
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    textarea:focus {
      background: #ffffff;
      border-color: rgba(0,122,255,0.45);
      box-shadow:
        0 0 0 4px rgba(0,122,255,0.12),
        inset 0 1px 2px rgba(0,0,0,0.08);
      transform: translateY(-1px);
    }

    #dynamicArea.visible textarea {
      animation: fadeLift 0.35s ease-out;
    }

    @keyframes fadeLift {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button {
      padding: 16px 28px;
      font-size: 18px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      max-width: 300px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Com'è stata la tua esperienza?</h2>

    <div class="stars">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>

    <div id="dynamicArea"></div>

    <button id="submitBtn">Invia</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
